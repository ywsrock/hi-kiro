name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  # ── Linux ────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf squashfs-tools

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiro-history/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workdir: kiro-history/src-tauri

      - name: npm install
        run: npm ci
        working-directory: kiro-history

      - name: Build (Linux)
        run: npm run tauri build
        working-directory: kiro-history

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            kiro-history/src-tauri/target/release/bundle/deb/*.deb
            kiro-history/src-tauri/target/release/bundle/rpm/*.rpm
            kiro-history/src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Windows ──────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiro-history/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workdir: kiro-history/src-tauri

      - name: npm install
        run: npm ci
        working-directory: kiro-history

      - name: Build (Windows)
        run: npm run tauri build
        working-directory: kiro-history

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            kiro-history/src-tauri/target/release/bundle/msi/*.msi
            kiro-history/src-tauri/target/release/bundle/nsis/*.exe

  # ── macOS ────────────────────────────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiro-history/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workdir: kiro-history/src-tauri

      - name: npm install
        run: npm ci
        working-directory: kiro-history

      - name: Build (macOS universal)
        run: npm run tauri build -- --target universal-apple-darwin
        working-directory: kiro-history

      - uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            kiro-history/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            kiro-history/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts/windows

      - uses: actions/download-artifact@v4
        with:
          name: macos-bundles
          path: artifacts/macos

      - name: Get version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.TAG }}
          name: hi-kiro ${{ steps.ver.outputs.TAG }}
          generate_release_notes: true
          body: |
            ## hi-kiro ${{ steps.ver.outputs.TAG }}

            kiro-cli 履歴横断検索ツール (Tauri v2 + React + Rust)

            ### インストール

            **Linux (Ubuntu/Debian/WSL2)**
            ```bash
            sudo dpkg -i hi-kiro_${{ steps.ver.outputs.VERSION }}_amd64.deb
            hi-kiro
            ```

            **Windows 11**
            `.msi` または `-setup.exe` をダブルクリック

            **macOS**
            `.dmg` をダブルクリックしてインストール

          files: |
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/linux/**/*.AppImage
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.exe
            artifacts/macos/**/*.dmg
            artifacts/macos/**/*.tar.gz
