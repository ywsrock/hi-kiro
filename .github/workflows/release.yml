name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0)'
        required: true
        default: '0.1.0'

jobs:
  # ── Linux Build ──────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiro-history/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workdir: kiro-history/src-tauri

      - name: Install npm dependencies
        run: npm ci
        working-directory: kiro-history

      - name: Build Tauri (Linux)
        run: npm run tauri build
        working-directory: kiro-history

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            kiro-history/src-tauri/target/release/bundle/deb/*.deb
            kiro-history/src-tauri/target/release/bundle/rpm/*.rpm
            kiro-history/src-tauri/target/release/bundle/appimage/*.AppImage

  # ── Windows Build ─────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: kiro-history/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workdir: kiro-history/src-tauri

      - name: Install npm dependencies
        run: npm ci
        working-directory: kiro-history

      - name: Build Tauri (Windows)
        run: npm run tauri build
        working-directory: kiro-history

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            kiro-history/src-tauri/target/release/bundle/msi/*.msi
            kiro-history/src-tauri/target/release/bundle/nsis/*.exe

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-bundles
          path: artifacts/linux

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundles
          path: artifacts/windows

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "TAG=v${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: hi-kiro ${{ steps.version.outputs.TAG }}
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## hi-kiro ${{ steps.version.outputs.TAG }}

            kiro-cli 履歴横断検索ツール (Tauri v2 + React + Rust)

            ---

            ### Linux インストール

            **Ubuntu / Debian / WSL2:**
            ```bash
            sudo dpkg -i hi-kiro_${{ steps.version.outputs.VERSION }}_amd64.deb
            hi-kiro
            ```

            **AppImage（インストール不要）:**
            ```bash
            chmod +x hi-kiro_${{ steps.version.outputs.VERSION }}_amd64.AppImage
            ./hi-kiro_${{ steps.version.outputs.VERSION }}_amd64.AppImage
            ```

            ### Windows 11 インストール

            `.msi` または `.exe` をダウンロードしてダブルクリック。

            > kiro-cli のセッションデータは自動検出されます。
            > WSL2 でも追加設定不要。

            ---

            ### 主な機能
            - 全セッション横断 FTS5 全文検索
            - Markdown レンダリングプレビュー
            - ブックマーク・タグ・リネーム・削除
            - 統計ダッシュボード（推定コスト・生産性・AI活用度）
            - セッション再開 `kiro-cli chat --resume-id`
            - エクスポート（MD / HTML / ZIP）
            - ダーク/ライトテーマ
          files: |
            artifacts/linux/**/*.deb
            artifacts/linux/**/*.rpm
            artifacts/linux/**/*.AppImage
            artifacts/windows/**/*.msi
            artifacts/windows/**/*.exe
